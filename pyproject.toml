[project]
name = "pyrocast"
version = "0.1.0"
description = "Pronóstico de propagación de incendios forestales — fusión de datos satelitales y meteorológicos abiertos."
requires-python = ">=3.12,<3.13"

[tool.uv.workspace]
members = ["shared", "ingestion", "features", "models", "serving"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# B008 flags function calls in argument defaults, but Typer's CLI option
# API (typer.Option(...) / typer.Argument(...) as a parameter default)
# requires exactly that pattern by design — not the mutable-default
# footgun the rule exists to catch.
"**/cli.py" = ["B008"]
# models/deep/train.py bundles the pyrocast-train CLI in the same file
# as the training loop (by explicit request) rather than a separate
# cli.py — same Typer B008 exemption applies for the same reason.
"models/src/models/deep/train.py" = ["B008"]
# models/deep/calibration.py bundles the pyrocast-calibrate CLI the
# same way — same Typer B008 exemption, same reason.
"models/src/models/deep/calibration.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
