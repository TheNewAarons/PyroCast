[project]
name = "features"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "shared",
    "rasterio>=1.3",
    "xarray>=2024.7",
    "rioxarray>=0.17",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "zarr>=2.18",
    "numpy>=2.0",
    "h5netcdf>=1.3",
    "h5py>=3.11",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/features"]
