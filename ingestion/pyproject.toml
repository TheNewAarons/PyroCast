[project]
name = "ingestion"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "shared",
    "features",
    "requests>=2.32",
    "cdsapi>=0.7",
    "typer>=0.12",
    "pyarrow>=17.0",
    "rasterio>=1.3",
    "numpy>=2.0",
    "xarray>=2024.7",
    "h5netcdf>=1.3",
    "h5py>=3.11",
    "openeo>=0.31",
]

[project.scripts]
pyrocast-ingest = "ingestion.cli:app"

[tool.uv.sources]
shared = { workspace = true }
features = { workspace = true }

[dependency-groups]
dev = ["responses>=0.25", "vcrpy>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]
