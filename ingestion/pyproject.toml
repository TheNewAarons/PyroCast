[project]
name = "ingestion"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "shared",
    "requests>=2.32",
    "cdsapi>=0.7",
    "typer>=0.12",
]

[tool.uv.sources]
shared = { workspace = true }

[dependency-groups]
dev = ["responses>=0.25", "vcrpy>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]
