[project]
name = "models"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "shared",
    "features",
    "numpy>=2.0",
    "torch>=2.4",
    "scikit-learn>=1.5",
    "typer>=0.12",
    "xarray>=2024.7",
    "zarr>=2.18",
    "matplotlib>=3.9",
]

[project.scripts]
pyrocast-models = "models.cli:app"
pyrocast-train = "models.deep.train:app"

[tool.uv.sources]
shared = { workspace = true }
features = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/models"]
