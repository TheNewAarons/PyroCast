[project]
name = "models"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "shared",
    "numpy>=2.0",
    "torch>=2.4",
    "scikit-learn>=1.5",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/models"]
